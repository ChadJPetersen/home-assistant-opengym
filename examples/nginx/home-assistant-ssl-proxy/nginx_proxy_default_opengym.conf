# Home Assistant "NGINX Home Assistant SSL proxy" custom default-server snippet.
#
# Install in Home Assistant's /share/nginx_proxy_default_opengym.conf.
# In the nginx app configuration: customize.active = true; leave
# customize.default = nginx_proxy_default*.conf (the default pattern).
#
# IMPORTANT: this file is included INSIDE the existing HA HTTPS server {}.
# Do NOT add a server {} wrapper, listen 443, or SSL certificate directives.
# Keep existing nginx_proxy_default*.conf files, including OrcaSlicer.
#
# Your installed openGym app is 3fa96add_opengym, which has the internal
# Home Assistant app DNS name 3fa96add-opengym (underscores -> hyphens).
# This connects directly to the app's internal API-only port 8100. The
# Home Assistant host-port mapping 8100/tcp MAY STAY DISABLED (null).
#
# Official Android/iOS phone app: enter https://YOUR_HA_HOST/opengym as
# the server URL, then redeem a code generated in openGym Settings -> Account.
# The native app appends /api/... (the prefix is preserved).
#
# Security: /opengym/api/* bypasses Home Assistant Ingress authentication.
# openGym performs its own pairing/token auth. Use only on a trusted HTTPS
# HA endpoint; the sign-in/pairing endpoints are intentionally accessible
# without an existing openGym session.

# Do not let non-API paths under /opengym/ fall through to Home Assistant.
location = /opengym {
    return 404;
}
location ^~ /opengym/ {
    return 404;
}

# /opengym/api/health -> http://3fa96add-opengym:8100/api/health
# /opengym/api/pair/redeem -> ...:8100/api/pair/redeem
# The trailing /api/ on proxy_pass is intentional: it strips /opengym.
location ^~ /opengym/api/ {
    proxy_pass http://3fa96add-opengym:8100/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP "";

    # Let openGym itself answer mobile CORS preflights. Do not add CORS
    # headers, intercept OPTIONS, or use browser-only proxy SSO here.
    proxy_connect_timeout 15s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_request_buffering off;
    client_max_body_size 48m;
}
