server {
    listen 8099;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    client_max_body_size 48m;

    # Home Assistant Ingress strips its dynamic path prefix before forwarding.
    # The upstream frontend computes API URLs relative to its displayed path.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Connecting-IP "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 5m;
    }
    location ^~ /api/media/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 48m;
    }
    # openGym's React screens use hash routing and relative asset URLs.
    location / {
        try_files $uri $uri/ /index.html;
    }
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # Allow WebAuthn on the SAME origin when the parent Home Assistant page is
    # HTTPS. This cannot override an iframe restriction set by the parent page.
    add_header Permissions-Policy "publickey-credentials-create=(self), publickey-credentials-get=(self)" always;
}

# The official Android/iOS app cannot authenticate through Home Assistant
# Ingress. A *separate*, API-only listener supports openGym's own pairing
# code + bearer token. Supervisor disables its HOST mapping by default.
# When enabled it is plain HTTP: use a trusted HTTPS proxy or private VPN.
server {
    listen 8100;
    server_name _;
    server_tokens off;

    location / {
        return 404;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 5m;
    }
    location ^~ /api/media/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 48m;
    }
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
}
