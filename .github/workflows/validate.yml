name: Validate Home Assistant app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate YAML, Dockerfile and app configuration
        run: |
          python3 -m pip install --disable-pip-version-check pyyaml
          python3 tests/validate.py
      - name: Check shell syntax
        run: sh -n opengym/rootfs/usr/local/bin/start-opengym
      - name: Build addon for amd64
        run: |
          docker build --pull --build-arg BUILD_FROM=node:22.23.4-alpine --build-arg OPENGYM_VERSION=1.4.3 -t opengym-ha:test opengym
      - name: nginx configuration smoke test
        run: docker run --rm --entrypoint nginx opengym-ha:test -t
      - name: Web and API startup smoke test
        run: |
          mkdir -p /tmp/opengym-smoke
          cat >/tmp/opengym-smoke/options.json <<'JSON'
          {"origin":"http://localhost:8123","password_login":true,"allow_guest":false,"first_user_admin":true,"session_days":30,"media_quota_mb":200,"media_uploads":true,"coach_disabled":false}
          JSON
          docker run -d --name opengym-test -v /tmp/opengym-smoke:/data -p 127.0.0.1:18099:8099 opengym-ha:test
          trap 'docker logs opengym-test; docker rm -f opengym-test' EXIT
          for n in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18099/api/health > /tmp/health.json; then break; fi
            sleep 2
          done
          python3 -c 'import json; assert json.load(open("/tmp/health.json"))["ok"] is True'
          curl -fsS http://127.0.0.1:18099/ | grep -qi '<html'
          curl -fsS http://127.0.0.1:18099/api/config > /dev/null
