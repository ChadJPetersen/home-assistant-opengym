name: Validate Home Assistant app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate YAML, Dockerfile and app configuration
        run: |
          python3 -m pip install --disable-pip-version-check pyyaml Pillow
          python3 tests/validate.py
          python3 tests/check_branding.py
      - name: Verify current app changelog
        run: python3 tests/check_release.py
      - name: Require version bump and release notes for deployed-app changes
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "Initial push: no previous commit to compare"
          else
            python3 tests/check_release.py --base "$BASE_SHA"
          fi
      - name: Test workout sensor calculations
        run: node tests/sensors.cjs
      - name: Check shell syntax
        run: sh -n opengym/rootfs/usr/local/bin/start-opengym
      - name: Build addon for amd64
        run: |
          # Match the base image Supervisor actually injects on the user's system.
          docker build --pull --build-arg BUILD_FROM=ghcr.io/home-assistant/base:latest --build-arg OPENGYM_VERSION=1.4.3 -t opengym-ha:test opengym
          # Catch missing Node/npm in Home Assistant's base image before release.
          docker run --rm --entrypoint node opengym-ha:test --version
          docker run --rm --entrypoint npm opengym-ha:test --version
      - name: nginx configuration smoke test
        run: docker run --rm --entrypoint nginx opengym-ha:test -t
      - name: Validate external HTTPS nginx proxy example
        run: |
          # Test a dedicated nginx vhost with temporary self-signed credentials.
          mkdir -p /tmp/opengym-mobile-cert
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -subj "/CN=gym.example.com" \
            -keyout /tmp/opengym-mobile-cert/privkey.pem \
            -out /tmp/opengym-mobile-cert/fullchain.pem >/dev/null 2>&1
          docker run --rm --entrypoint nginx \
            -v /tmp/opengym-mobile-cert:/etc/letsencrypt/live/gym.example.com:ro \
            -v "$PWD/examples/nginx/opengym-mobile.conf.example:/etc/nginx/http.d/mobile.conf:ro" \
            opengym-ha:test -t
      - name: Validate Home Assistant NGINX SSL proxy path snippet
        run: |
          # The NGINX SSL proxy app inserts these locations INSIDE its
          # existing HTTPS server. CI substitutes 127.0.0.1 for the
          # Supervisor-only DNS name to exercise nginx syntax and mapping.
          mkdir -p /tmp/ha-path-proxy
          sed 's/3fa96add-opengym/127.0.0.1/g' \
            examples/nginx/home-assistant-ssl-proxy/nginx_proxy_default_opengym.conf \
            >/tmp/ha-path-proxy/opengym.conf
          cat >/tmp/ha-path-proxy/default.conf <<'NGINX'
          server {
              listen 8110;
              server_name _;
              include /etc/nginx/ha-opengym.conf;
              location / { return 200 "existing Home Assistant route"; }
          }
          NGINX
          docker run --rm --entrypoint nginx \
            -v /tmp/ha-path-proxy/default.conf:/etc/nginx/http.d/ha-proxy.conf:ro \
            -v /tmp/ha-path-proxy/opengym.conf:/etc/nginx/ha-opengym.conf:ro \
            opengym-ha:test -t
      - name: Web and API startup smoke test
        run: |
          mkdir -p /tmp/opengym-smoke
          cat >/tmp/opengym-smoke/options.json <<'JSON'
          {"origin":"http://localhost:8123","password_login":true,"allow_guest":false,"first_user_admin":true,"session_days":30,"media_quota_mb":200,"media_uploads":true,"coach_disabled":false,"home_assistant_sensors":false,"ha_include_bodyweight":false,"ha_timezone":"UTC","ha_poll_seconds":120}
          JSON
          docker run -d --name opengym-test -v /tmp/opengym-smoke:/data -p 127.0.0.1:18099:8099 -p 127.0.0.1:18100:8100 -p 127.0.0.1:18110:8110 \
            -v /tmp/ha-path-proxy/default.conf:/etc/nginx/http.d/ha-proxy.conf:ro \
            -v /tmp/ha-path-proxy/opengym.conf:/etc/nginx/ha-opengym.conf:ro \
            opengym-ha:test
          trap 'docker logs opengym-test; docker rm -f opengym-test' EXIT
          for n in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18099/api/health > /tmp/health.json; then break; fi
            sleep 2
          done
          python3 -c 'import json; assert json.load(open("/tmp/health.json"))["ok"] is True'
          curl -fsS http://127.0.0.1:18099/ | grep -qi '<html'
          curl -fsS http://127.0.0.1:18099/api/config > /dev/null
          # API-only listener for native apps must not expose the web frontend.
          curl -fsS http://127.0.0.1:18100/api/health >/dev/null
          curl -fsS http://127.0.0.1:18100/api/config >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18100/)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18100/index.html)" = "404"
          curl -fsS -X OPTIONS -D /tmp/mobile-cors.hdr -o /dev/null \
            -H 'Origin: https://localhost' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type,authorization' \
            http://127.0.0.1:18100/api/pair/redeem
          grep -qi '^access-control-allow-origin: https://localhost' /tmp/mobile-cors.hdr
          # Simulate the app-to-app Home Assistant nginx /opengym routing.
          curl -fsS http://127.0.0.1:18110/opengym/api/health >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18110/opengym/)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18110/)" = "200"
          curl -fsS -X OPTIONS -D /tmp/ha-path-cors.hdr -o /dev/null \
            -H 'Origin: https://localhost' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type,authorization' \
            http://127.0.0.1:18110/opengym/api/pair/redeem
          grep -qi '^access-control-allow-origin: https://localhost' /tmp/ha-path-cors.hdr
