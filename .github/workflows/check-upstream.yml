name: Check for new openGym releases
on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare latest upstream release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request, subprocess
          metadata = open('opengym/build.yaml').read()
          current = re.search(r'OPENGYM_VERSION:\s*"([^"]+)"', metadata).group(1)
          request = urllib.request.Request('https://api.github.com/repos/DuarteSantos8/openGym/releases/latest',
              headers={'Accept':'application/vnd.github+json','User-Agent':'HA-openGym-version-check'})
          latest = json.load(urllib.request.urlopen(request))['tag_name'].lstrip('v')
          if current == latest:
              print('Up to date: '+current)
          else:
              title = f'Update openGym from {current} to {latest}'
              existing = subprocess.check_output(['gh','issue','list','--state','open','--search',f'{title} in:title','--json','title'],text=True)
              if not any(x['title']==title for x in json.loads(existing)):
                  subprocess.run(['gh','issue','create','--title',title,'--body',
                      f'New upstream release: https://github.com/DuarteSantos8/openGym/releases/tag/v{latest}\n\nUpdate build.yaml, Dockerfile pins, config.yaml, workflows and run the build smoke test.'],check=True)
          PY
